<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b13">
  <title>在线时钟</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="clock" aria-label="东八区实时时钟">
    <div class="clock__time" id="time" role="timer" aria-live="off">00:00:00</div>
    <div class="clock__divider" aria-hidden="true"></div>
    <div class="clock__date" id="date">加载中…</div>
  </main>

  <script src="clock.js"></script>
</body>
</html>
